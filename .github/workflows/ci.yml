name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Public pages read the menu from the database at build time, so the build needs one.
    # A throwaway Postgres container keeps CI independent of any real database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Turns on the database integration tests (read-only, seeded data).
      INTEGRATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply migrations and seed the CI database
        run: npm run db:setup
      - name: Tests with coverage gate (80%)
        run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end scenarios (guest, customer, staff, admin)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations and seed the CI database
        run: npm run db:setup
      - run: npm run build
      - name: Start the site
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 2; done
          cat server.log; exit 1
      - name: Run the scenarios
        run: npm run e2e
      - name: Site log (on failure)
        if: failure()
        run: cat server.log
